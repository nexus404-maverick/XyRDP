name: Validate Sunshine installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('setup-sunshine','setup-rdp','publish-status','finalize-rdp')) {
            $errors=$null; $tokens=$null
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/$file.ps1",[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install and verify signed Sunshine stable MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          ./scripts/setup-sunshine.ps1
          $svc=Get-Service | Where-Object { $_.DisplayName -match '^Sunshine' } | Select-Object -First 1
          if (-not $svc -and -not (Get-Process sunshine -ErrorAction SilentlyContinue)) { throw 'Sunshine process/service not running' }
          foreach ($port in @(47984,47989,48010)) {
            if (-not (Get-NetFirewallRule -DisplayName "XyRDP Sunshine TCP $port" -ErrorAction SilentlyContinue)) { throw "Missing TCP firewall rule $port" }
          }
