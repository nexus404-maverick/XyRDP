# XyRDP-VN — RDP qua hypertunnel TCP relay
name: XyRDP-VN — RDP 6 giờ

on:
  workflow_dispatch:
    inputs:
      thoi_gian_phut:
        description: 'Thời gian phiên (phút, 10–360)'
        required: false
        default: '360'
        type: string
      ten_may:
        description: 'Tiền tố tên máy (hostname)'
        required: false
        default: 'xyrdp'
        type: string
      ten_nguoi_dung:
        description: 'Tên tài khoản Windows (3–20 ký tự)'
        required: false
        default: 'xyadmin'
        type: string

permissions:
  contents: read

env:
  THOI_GIAN: ${{ inputs.thoi_gian_phut || '360' }}
  TEN_MAY: ${{ inputs.ten_may || 'xyrdp' }}
  TEN_NGUOI_DUNG: ${{ inputs.ten_nguoi_dung || 'xyadmin' }}
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

jobs:
  man-hinh:
    name: Windows RDP + hypertunnel
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt cơ bản (tạo user + bật RDP)
        shell: pwsh
        run: ./scripts/cai-rdp-co-ban.ps1

      - name: Kiểm tra RDP listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $listener) {
            # Start Remote Desktop Services and wait briefly for the listener.
            Set-Service -Name TermService -StartupType Automatic
            Start-Service -Name TermService -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
            $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          }
          if (-not $listener) {
            qwinsta
            throw 'RDP is not listening on TCP port 3389.'
          }
          Write-Host 'RDP listener is active on port 3389.'

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Khởi chạy hypertunnel
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\XyRDP\hypertunnel'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $outLog = Join-Path $work 'hypertunnel.out.log'
          $errLog = Join-Path $work 'hypertunnel.err.log'
          Remove-Item $outLog,$errLog -Force -ErrorAction SilentlyContinue

          Write-Host 'Starting TCP tunnel for RDP port 3389...'
          $proc = Start-Process -FilePath $env:ComSpec `
            -ArgumentList @('/d','/s','/c','npx --yes hypertunnel@1.2.8 --port 3389 --localhost 127.0.0.1') `
            -WorkingDirectory $work `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog

          $hostPublic = $null
          $portPublic = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            $logs = ''
            if (Test-Path $outLog) { $logs += Get-Content $outLog -Raw -ErrorAction SilentlyContinue }
            if (Test-Path $errLog) { $logs += "`n" + (Get-Content $errLog -Raw -ErrorAction SilentlyContinue) }

            # Example output: Tunneling hypertunnel.ga:19432 > localhost:3389
            if ($logs -match '(?i)Tunneling\s+([a-z0-9.-]+):(\d{2,5})\s*>\s*localhost:3389') {
              $hostPublic = $matches[1]
              $portPublic = $matches[2]
              break
            }

            if ($proc.HasExited) {
              Write-Host "hypertunnel process exited with code $($proc.ExitCode)."
              break
            }
          }

          if (-not $hostPublic -or -not $portPublic) {
            Write-Host 'Could not detect the public hypertunnel endpoint.'
            if (Test-Path $outLog) { Get-Content $outLog -Tail 80 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 80 }
            throw 'hypertunnel failed to publish an endpoint. The public relay may be unavailable.'
          }

          "HYPERTUNNEL_HOST=$hostPublic" >> $env:GITHUB_ENV
          "HYPERTUNNEL_PORT=$portPublic" >> $env:GITHUB_ENV
          "HYPERTUNNEL_PID=$($proc.Id)" >> $env:GITHUB_ENV

          Write-Host "RDP endpoint: ${hostPublic}:$portPublic" -ForegroundColor Green
          Write-Host 'Connect with Remote Desktop (mstsc): host:port.'
          Write-Host 'Username: use the TEN_NGUOI_DUNG input.'
          Write-Host 'Password: use the GitHub Secret RDP_PASSWORD.'

      - name: Công bố thông tin kết nối
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = $env:TEN_NGUOI_DUNG
          $hostPublic = $env:HYPERTUNNEL_HOST
          $portPublic = $env:HYPERTUNNEL_PORT
          if (-not $hostPublic -or -not $portPublic) {
            throw 'Public endpoint is missing.'
          }

          $dir = 'C:\XyRDP\out'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Write-Host ''
          Write-Host '========== XYRDP-VN RDP ==========' -ForegroundColor Green
          Write-Host "Computer: ${hostPublic}:$portPublic" -ForegroundColor Cyan
          Write-Host "Username: $user" -ForegroundColor Cyan
          Write-Host 'Password: use the value stored in GitHub Secret RDP_PASSWORD' -ForegroundColor Yellow
          Write-Host '=================================='
          Write-Host 'Do not share the endpoint or password publicly.'

          @"
          XyRDP-VN — RDP CONNECTION
          Computer: ${hostPublic}:$portPublic
          Username: $user
          Password: GitHub Secret RDP_PASSWORD
          Client: Microsoft Remote Desktop / Windows mstsc
          "@ | Set-Content (Join-Path $dir 'dia-chi-truy-cap.txt') -Encoding UTF8

      - name: Upload connection details
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-connection-details
          path: C:\XyRDP\out\dia-chi-truy-cap.txt
          if-no-files-found: error
          retention-days: 1

      - name: Giữ phiên sống
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dur = [int](($env:THOI_GIAN -replace '\D', ''))
          if ($dur -lt 10) { $dur = 60 }
          if ($dur -gt 360) { $dur = 360 }

          $endTime = (Get-Date).AddMinutes([Math]::Max(5, $dur - 3))
          $tunnelLog = 'C:\XyRDP\hypertunnel\hypertunnel.out.log'
          $tunnelErr = 'C:\XyRDP\hypertunnel\hypertunnel.err.log'

          Write-Host "Session will run for up to $dur minutes."
          while ((Get-Date) -lt $endTime) {
            $proc = Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -match 'hypertunnel' } |
              Select-Object -First 1

            $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

            if (-not $listener) {
              Write-Warning 'RDP listener is no longer active.'
            }
            if (-not $proc) {
              Write-Warning 'hypertunnel process not found; see startup logs.'
              if (Test-Path $tunnelLog) { Get-Content $tunnelLog -Tail 15 }
              if (Test-Path $tunnelErr) { Get-Content $tunnelErr -Tail 15 }
              break
            }

            Write-Host "Heartbeat $(Get-Date -Format 'HH:mm:ss') | RDP=$([bool]$listener) | tunnel process=$($proc.ProcessId)"
            Start-Sleep -Seconds 60
          }

          Write-Host 'Session time reached or tunnel stopped.'
